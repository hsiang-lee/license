version: '3'
services:
  smlicense-gateway:
    image: smlicenseserver:latest
    container_name: smlicense-gateway
    network_mode: "host"
    entrypoint: /gateway
    restart: always
    depends_on:
      - smlicense-grpcserver
  smlicense-grpcserver:
    image: smlicenseserver:latest
    container_name: smlicense-grpcserver
    network_mode: "host"
    entrypoint: /smlicense-service
    restart: always